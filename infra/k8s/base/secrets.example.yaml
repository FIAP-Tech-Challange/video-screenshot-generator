apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: video-app
type: Opaque
stringData:
  # Database
  POSTGRES_USER: "app_user"
  POSTGRES_PASSWORD: "CHANGE_ME"  # ← Alterar no secrets.yaml real
  
  # MinIO
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "CHANGE_ME"   # ← Alterar no secrets.yaml real
  
  # JWT
  JWT_SECRET: "CHANGE_ME"         # ← Alterar no secrets.yaml real
  
  # SMTP
  SMTP_HOST: "smtp.ethereal.email"
  SMTP_PORT: "587"
  SMTP_USER: "your_email@example.com"
  SMTP_PASS: "CHANGE_ME"          # ← Alterar no secrets.yaml real
