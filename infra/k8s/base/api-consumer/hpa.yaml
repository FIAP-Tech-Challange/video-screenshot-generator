apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-consumer-hpa
  namespace: video-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-consumer
  minReplicas: 1
  maxReplicas: 10  # Máximo = número de partições do Kafka
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Aguarda 5min antes de reduzir
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60   # Escala rápido
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
