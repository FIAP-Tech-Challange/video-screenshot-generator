apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: video-app
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape das APIs NestJS
      - job_name: 'api-bff'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['api-bff:3000']
        
      - job_name: 'api-consumer'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['api-consumer:3001']

      # Scrape do próprio Prometheus
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Service Discovery - Descobre todos os pods automaticamente
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - video-app
        relabel_configs:
          # Apenas pods com annotation prometheus.io/scrape=true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Usa a porta da annotation ou 8080 default
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          # Usa o path da annotation ou /metrics default
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Labels úteis
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
