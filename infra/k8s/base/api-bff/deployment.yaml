apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-bff
  namespace: video-app
  labels:
    app: api-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-bff
  template:
    metadata:
      labels:
        app: api-bff
    spec:
      hostAliases:
      - ip: "172.19.0.1"
        hostnames:
        - "host.docker.internal"
      containers:
      - name: api-bff
        image: api-bff:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_DB
        - name: DB_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
        - name: DB_LOGGING
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_LOGGING
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: MINIO_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MINIO_URL
        - name: MINIO_PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MINIO_PUBLIC_URL
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: MINIO_SECRET_KEY
        - name: BUCKET_VIDEO_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BUCKET_VIDEO_NAME
        - name: BUCKET_SCREENSHOT_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BUCKET_SCREENSHOT_NAME
        - name: BUCKET_REGION
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: BUCKET_REGION
        - name: MAX_FILE_SIZE_MB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MAX_FILE_SIZE_MB
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_URL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
