name: CI - Frontend

on:
  push:
    paths:
      - "projects/frontend/**"
  pull_request:
    paths:
      - "projects/frontend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: projects/frontend

      - name: Run tests
        run: npm run test:cov
        working-directory: projects/frontend
