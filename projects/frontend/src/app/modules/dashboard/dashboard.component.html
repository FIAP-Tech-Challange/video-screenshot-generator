<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Bem-vindo, {{ userName }}!</h1>
    <p>Resumo do seu uso</p>
  </div>

  <div class="dashboard-cards" nz-row [nzGutter]="[16, 16]">
    <div nz-col [nzXs]="24" [nzSm]="12" [nzLg]="12">
      <nz-card
        class="dashboard-card modern-card"
        nzHoverable
        (click)="navigateToVideos()"
      >
        <div class="card-content clickable">
          <div class="card-icon card-icon-videos">
            <span nz-icon nzType="video-camera" nzTheme="outline"></span>
          </div>
          <div class="card-info">
            <h3>{{ videosService.totalCount() }}</h3>
            <p>Vídeos Enviados</p>
          </div>
          <span nz-icon nzType="arrow-right" class="arrow"></span>
        </div>
      </nz-card>
    </div>

    <div nz-col [nzXs]="24" [nzSm]="12" [nzLg]="12">
      <nz-card
        class="dashboard-card modern-card"
        nzHoverable
        (click)="navigateToUpload()"
      >
        <div class="card-content clickable">
          <div class="card-icon card-icon-upload">
            <span nz-icon nzType="cloud-upload" nzTheme="outline"></span>
          </div>
          <div class="card-info">
            <h3>Upload Rápido</h3>
            <p>Envie um novo vídeo</p>
          </div>
          <span nz-icon nzType="arrow-right" class="arrow"></span>
        </div>
      </nz-card>
    </div>
  </div>
</div>
