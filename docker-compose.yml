services:
    postgres:
        image: postgres:15
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PORT: ${POSTGRES_PORT}
        ports:
            - "${POSTGRES_PORT}:${POSTGRES_PORT}"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - microservices
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    db-migrate:
        image: node:20-alpine
        container_name: db-migrate
        restart: "no"
        environment:
            DB_HOST: postgres
            DB_PORT: ${POSTGRES_PORT}
            DB_USERNAME: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            DB_NAME: ${POSTGRES_DB}
            DB_LOGGING: ${DB_LOGGING}
        working_dir: /usr/src/app
        volumes:
            - ./infra/database:/usr/src/app
        networks:
            - microservices
        depends_on:
            postgres:
                condition: service_healthy
        command: sh -c "npm install && npm run migration:run"

    api-bff:
        build:
            context: ./projects/api-bff
            dockerfile: Dockerfile
            target: dev
        image: api-bff:dev
        container_name: api-bff
        restart: unless-stopped
        environment:
            NODE_ENV: development
            PORT: ${API_BFF_PORT}
            DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
            DB_LOGGING: ${DB_LOGGING}
            JWT_SECRET: ${JWT_SECRET}
            MINIO_ENDPOINT: minio
            MINIO_PORT: ${MINIO_PORT}
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
            BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME}
            MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
        ports:
            - "${API_BFF_PORT}:${API_BFF_PORT}"
        volumes:
            - ./projects/api-bff:/usr/src/app
            - /usr/src/app/node_modules
        networks:
            - microservices
        depends_on:
            postgres:
                condition: service_healthy
            db-migrate:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- --timeout=2 http://127.0.0.1:${API_BFF_PORT}/api/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    api-consumer:
        build:
            context: ./projects/api-consumer
            dockerfile: Dockerfile
            target: dev
        image: api-consumer:dev
        container_name: api-consumer
        restart: unless-stopped
        environment:
            NODE_ENV: development
            PORT: ${API_CONSUMER_PORT}
            DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
            DB_LOGGING: ${DB_LOGGING}
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
            MINIO_URL: http://minio:${MINIO_PORT}
            BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME}
            BUCKET_SCREENSHOT_NAME: ${BUCKET_SCREENSHOT_NAME}
            BUCKET_REGION: us-east-1
            KAFKA_BROKER: kafka:${KAFKA_INTERNAL_PORT}
        ports:
            - "${API_CONSUMER_PORT}:${API_CONSUMER_PORT}"
        volumes:
            - ./projects/api-consumer:/usr/src/app
            - /usr/src/app/node_modules
        networks:
            - microservices
        depends_on:
            postgres:
                condition: service_healthy
            db-migrate:
                condition: service_completed_successfully
            kafka:
                condition: service_healthy
            minio-init:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- --timeout=2 http://127.0.0.1:${API_CONSUMER_PORT}/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    minio:
        image: minio/minio:latest
        container_name: minio
        restart: unless-stopped
        ports:
            - "${MINIO_PORT}:${MINIO_PORT}"
            - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
            MINIO_NOTIFY_KAFKA_ENABLE_meukafka: "on"
            MINIO_NOTIFY_KAFKA_BROKERS_meukafka: "kafka:${KAFKA_INTERNAL_PORT}"
            MINIO_NOTIFY_KAFKA_TOPIC_meukafka: "${MINIO_KAFKA_TOPIC}"
        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - microservices
        volumes:
            - minio_data:/data
        command: server /data --address ":${MINIO_PORT}" --console-address ":${MINIO_CONSOLE_PORT}"
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-f",
                    "http://localhost:${MINIO_PORT}/minio/health/live",
                ]
            interval: 5s
            timeout: 20s
            retries: 5

    minio-init:
        image: minio/mc:latest
        container_name: minio-init
        restart: "no"
        entrypoint: ["/bin/sh"]
        environment:
            _MINIO_USER: ${MINIO_ACCESS_KEY}
            _MINIO_PASS: ${MINIO_SECRET_KEY}
            BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME}
            BUCKET_SCREENSHOT_NAME: ${BUCKET_SCREENSHOT_NAME}
        volumes:
            - ./infra/minio/init.sh:/init.sh
        command: /init.sh
        depends_on:
            minio:
                condition: service_healthy
        networks:
            - microservices

    kafka:
        image: confluentinc/cp-kafka:latest
        container_name: kafka
        networks:
            - microservices
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT},CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},PLAINTEXT_HOST://localhost:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1",
                ]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 30s

    kafdrop:
        image: obsidiandynamics/kafdrop:latest
        container_name: kafdrop
        networks:
            - microservices
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - "19000:9000"
        environment:
            KAFKA_BROKERCONNECT: kafka:${KAFKA_INTERNAL_PORT}

networks:
    microservices:
        driver: bridge

volumes:
    postgres_data:
    minio_data:
