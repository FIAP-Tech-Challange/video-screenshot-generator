services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrate:
    build:
      context: ./infra/database
      dockerfile: Dockerfile
    container_name: db-migrate
    restart: "no"
    environment:
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      DB_LOGGING: ${DB_LOGGING}
    working_dir: /usr/src/app
    volumes:
      - ./infra/database:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - microservices
    depends_on:
      postgres:
        condition: service_healthy

  api-bff:
    build:
      context: ./projects/api-bff
      dockerfile: Dockerfile
      target: dev
    image: api-bff:dev
    container_name: api-bff
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${API_BFF_PORT}
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      DB_LOGGING: ${DB_LOGGING}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_URL: http://minio:${MINIO_PORT}
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME}
      BUCKET_SCREENSHOT_NAME: ${BUCKET_SCREENSHOT_NAME}
      BUCKET_REGION: us-east-1
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      REDIS_URL: redis://redis:${REDIS_PORT}
    ports:
      - "${API_BFF_PORT}:${API_BFF_PORT}"
    volumes:
      - ./projects/api-bff:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - microservices
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=2 http://127.0.0.1:${API_BFF_PORT}/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api-consumer:
    build:
      context: ./projects/api-consumer
      dockerfile: Dockerfile
      target: dev
    image: api-consumer:dev
    container_name: api-consumer
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${API_CONSUMER_PORT}
      DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      DB_LOGGING: ${DB_LOGGING}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_URL: http://minio:${MINIO_PORT}
      BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME}
      BUCKET_SCREENSHOT_NAME: ${BUCKET_SCREENSHOT_NAME}
      BUCKET_REGION: us-east-1
      KAFKA_BROKER: kafka:${KAFKA_INTERNAL_PORT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "${API_CONSUMER_PORT}:${API_CONSUMER_PORT}"
    volumes:
      - ./projects/api-consumer:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - microservices
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --timeout=2 http://127.0.0.1:${API_CONSUMER_PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_NOTIFY_KAFKA_ENABLE_meukafka: "on"
      MINIO_NOTIFY_KAFKA_BROKERS_meukafka: "kafka:${KAFKA_INTERNAL_PORT}"
      MINIO_NOTIFY_KAFKA_TOPIC_meukafka: "${MINIO_KAFKA_TOPIC}"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - microservices
    volumes:
      - minio_data:/data
    command: server /data --address ":${MINIO_PORT}" --console-address ":${MINIO_CONSOLE_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${MINIO_PORT}/minio/health/live",
        ]
      interval: 5s
      timeout: 20s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_URL: http://minio:${MINIO_PORT}
      BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME}
      BUCKET_SCREENSHOT_NAME: ${BUCKET_SCREENSHOT_NAME}
    volumes:
      - ./infra/minio/init.sh:/init.sh
    command: ["tr -d '\\r' < /init.sh | sh"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - microservices

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    networks:
      - microservices
    ports:
      - "${KAFKA_HOST_PORT}:${KAFKA_HOST_PORT}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT},PLAINTEXT_HOST://0.0.0.0:${KAFKA_HOST_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:${KAFKA_HOST_PORT} > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 5; \
      kafka-topics --bootstrap-server kafka:${KAFKA_INTERNAL_PORT} --create --topic ${MINIO_KAFKA_TOPIC} --partitions 1 --replication-factor 1 || true; \
      echo 'kafka-init: topic created (or already exists), waiting for Group Coordinator...'; sleep 10; \
      exit 0"

  frontend:
    build:
      context: ./projects/frontend
      dockerfile: Dockerfile
      target: dev
    image: frontend:dev
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./projects/frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - microservices
    depends_on:
      api-bff:
        condition: service_healthy

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    networks:
      - microservices
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "19000:19000"
    environment:
      KAFKA_BROKERCONNECT: kafka:${KAFKA_INTERNAL_PORT}

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/grafana:latest
    ports: ["3005:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/api.json
    depends_on: [prometheus]
    networks:
      - microservices
    volumes:
      - ./infra/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./infra/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
    depends_on: [postgres]
    networks:
      - microservices

  kafka-exporter:
    image: danielqsj/kafka-exporter
    command: ["--kafka.server=kafka:${KAFKA_INTERNAL_PORT}"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["9308:9308"]
    networks:
      - microservices

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: redis-server --port ${REDIS_PORT} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  microservices:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
