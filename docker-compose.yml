services:
    postgres:
        image: postgres:15
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-app_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
            POSTGRES_DB: ${POSTGRES_DB:-app_db}
            POSTGRES_PORT: ${POSTGRES_PORT:-5432}
        ports:
            - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - microservices
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    db-migrate:
        image: node:20-alpine
        container_name: db-migrate
        restart: "no"
        environment:
            DB_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_pass}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-app_db}
            DB_LOGGING: ${DB_LOGGING:-true}
        working_dir: /usr/src/app
        volumes:
            - ./infra/database:/usr/src/app
        networks:
            - microservices
        depends_on:
            postgres:
                condition: service_healthy
        command: sh -c "npm install && npm run migration:run"

    api-bff:
        build:
            context: ./projects/api-bff
            dockerfile: Dockerfile
            target: dev
        image: api-bff:dev
        container_name: api-bff
        restart: unless-stopped
        environment:
            NODE_ENV: development
            PORT: ${API_BFF_PORT:-3000}
            DB_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_pass}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-app_db}
            DB_LOGGING: ${DB_LOGGING:-true}
            JWT_SECRET: ${JWT_SECRET:-secret123}
            MINIO_ENDPOINT: minio
            MINIO_PORT: ${MINIO_PORT:-9000}
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
            BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME:-video}
            BUCKET_REGION: us-east-1
            MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
        ports:
            - "${API_BFF_PORT:-3000}:${API_BFF_PORT:-3000}"
        volumes:
            - ./projects/api-bff:/usr/src/app
            - /usr/src/app/node_modules
        networks:
            - microservices
        depends_on:
            postgres:
                condition: service_healthy
            db-migrate:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- --timeout=2 http://127.0.0.1:$${PORT}/api/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    api-consumer:
        build:
            context: ./projects/api-consumer
            dockerfile: Dockerfile
            target: dev
        image: api-consumer:dev
        container_name: api-consumer
        restart: unless-stopped
        environment:
            NODE_ENV: development
            PORT: ${API_CONSUMER_PORT:-3001}
            DB_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-app_pass}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-app_db}
            DB_LOGGING: ${DB_LOGGING:-true}
            MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_URL: http://minio:${MINIO_PORT:-9000}
            BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME:-video}
            BUCKET_SCREENSHOT_NAME: ${BUCKET_SCREENSHOT_NAME:-screenshot}
            BUCKET_REGION: us-east-1
            KAFKA_BROKER: kafka:${KAFKA_INTERNAL_PORT:-9093}
        ports:
            - "${API_CONSUMER_PORT:-3001}:${API_CONSUMER_PORT:-3001}"
        volumes:
            - ./projects/api-consumer:/usr/src/app
            - /usr/src/app/node_modules
        networks:
            - microservices
        depends_on:
            postgres:
                condition: service_healthy
            db-migrate:
                condition: service_completed_successfully
            kafka:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            minio-init:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- --timeout=2 http://127.0.0.1:$${PORT}/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    minio:
        image: minio/minio:latest
        container_name: minio
        restart: unless-stopped
        ports:
            - "${MINIO_PORT:-9000}:${MINIO_PORT:-9000}"
            - "${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}"
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_NOTIFY_KAFKA_ENABLE_meukafka: "on"
            MINIO_NOTIFY_KAFKA_BROKERS_meukafka: "kafka:${KAFKA_INTERNAL_PORT:-9093}"
            MINIO_NOTIFY_KAFKA_TOPIC_meukafka: "${MINIO_KAFKA_TOPIC:-upload-video}"
        depends_on:
            kafka:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
        networks:
            - microservices
        volumes:
            - minio_data:/data
        command: server /data --address ":${MINIO_PORT:-9000}" --console-address ":${MINIO_CONSOLE_PORT:-9001}"
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 5s
            timeout: 20s
            retries: 5

    minio-init:
        image: minio/mc:latest
        container_name: minio-init
        restart: "no"
        entrypoint: ["/bin/sh"]
        env_file: .env
        environment:
            MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
            MINIO_URL: http://minio:${MINIO_PORT:-9000}
            BUCKET_VIDEO_NAME: ${BUCKET_VIDEO_NAME:-video}
            BUCKET_SCREENSHOT_NAME: ${BUCKET_SCREENSHOT_NAME:-screenshot}
        volumes:
            - ./infra/minio/init.sh:/init.sh
        command: /init.sh
        depends_on:
            minio:
                condition: service_healthy
        networks:
            - microservices

    kafka:
        image: confluentinc/cp-kafka:latest
        container_name: kafka
        networks:
            - microservices
        ports:
            - "${KAFKA_HOST_PORT:-9092}:${KAFKA_HOST_PORT:-9092}"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT:-9093},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-29093},PLAINTEXT_HOST://0.0.0.0:${KAFKA_HOST_PORT:-9092}
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-9093},PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT:-29093}
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
            CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1",
                ]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 30s

    kafka-init:
        image: confluentinc/cp-kafka:latest
        container_name: kafka-init
        restart: "no"
        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - microservices
        entrypoint: ["/bin/sh", "-c"]
        command: >
            "sleep 5; \
            kafka-topics --bootstrap-server kafka:${KAFKA_INTERNAL_PORT:-9093} --create --topic ${MINIO_KAFKA_TOPIC:-upload-video} --partitions 1 --replication-factor 1 || true; \
            echo 'kafka-init: topic created (or already exists)'; exit 0"

    kafdrop:
        image: obsidiandynamics/kafdrop:latest
        container_name: kafdrop
        networks:
            - microservices
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - "19000:19000"
        environment:
            KAFKA_BROKERCONNECT: kafka:${KAFKA_INTERNAL_PORT:-9093}

networks:
    microservices:
        driver: bridge

volumes:
    postgres_data:
    minio_data:
