global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api-consumer"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-consumer:3001"]

  - job_name: "api-bff"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-bff:3000"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
